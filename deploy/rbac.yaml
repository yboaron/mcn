apiVersion: v1
kind: ServiceAccount
metadata:
  name: skynet-operator
  namespace: skynet-operator
  labels:
    app.kubernetes.io/name: skynet
    app.kubernetes.io/component: skynet-operator
    app.kubernetes.io/managed-by: skynet-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skynet-operator
  labels:
    app.kubernetes.io/name: skynet
    app.kubernetes.io/component: skynet-operator
    app.kubernetes.io/managed-by: skynet-operator
rules:
  # Operator manages broker and agent Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Operator creates ServiceAccounts for broker and agent
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create"]
  # Operator ensures its own namespace exists
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  # Skynet controller: reconcile agent Deployment, sync broker secret, update Skynet status
  - apiGroups: ["skynet.io"]
    resources: ["skynets", "skynets/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skynet-operator
  labels:
    app.kubernetes.io/name: skynet
    app.kubernetes.io/component: skynet-operator
    app.kubernetes.io/managed-by: skynet-operator
subjects:
  - kind: ServiceAccount
    name: skynet-operator
    namespace: skynet-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skynet-operator
