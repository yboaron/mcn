kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: multiclusternetworks.skynet.io
spec:
  group: skynet.io
  names:
    kind: MultiClusterNetwork
    listKind: MultiClusterNetworkList
    plural: multiclusternetworks
    shortNames:
    - mcn
    singular: multiclusternetwork
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          MultiClusterNetwork represents a multi-cluster network across clusters.
          Created and managed on the broker.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              routeTarget:
                description: |-
                  RouteTarget is the BGP EVPN route target in format "<ASN>:<VNI>"
                  Uses fixed ASN 65000 for route targets
                pattern: ^\d+:\d+$
                type: string
              topology:
                description: Topology is the network topology type
                enum:
