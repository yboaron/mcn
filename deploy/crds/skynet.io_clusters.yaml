---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: clusters.skynet.io
spec:
  group: skynet.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster represents cluster registration and endpoints in the broker.
          Created and managed by SkyNet agent.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              asn:
                description: |-
                  ASN is the allocated BGP ASN for this cluster
                  Allocated by SkyNet agent using optimistic locking
                format: int32
                maximum: 65534
                minimum: 64512
                type: integer
              clusterID:
                description: ClusterID is the unique identifier for this cluster
                maxLength: 63
                minLength: 1
                type: string
              vtepCIDR:
                description: |-
                  VtepCIDR is the allocated VTEP CIDR for this cluster
                  Allocated by SkyNet agent using optimistic locking
                type: string
            required:
            - asn
            - clusterID
            - vtepCIDR
            type: object
          status:
            properties:
              endpoints:
                description: Endpoints is the list of node endpoints in this cluster
                items:
                  properties:
                    bgpPeerIP:
                      description: BgpPeerIP is the IP address used for BGP peering
                      type: string
                    node:
                      description: Node is the node name
                      type: string
                    routeReflector:
                      description: RouteReflector indicates if this node is a Route
                        Reflector
                      type: boolean
                    vtepIP:
                      description: VtepIP is the VTEP IP address for this node
                      type: string
                  required:
                  - bgpPeerIP
                  - node
                  - vtepIP
                  type: object
                type: array
              lastHeartbeat:
                description: LastHeartbeat is the timestamp of the last update from
                  the cluster
                format: date-time
                type: string
              phase:
                description: Phase represents the current state of the cluster
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
